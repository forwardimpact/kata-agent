name: Kata Agent
description: >
  Run a Kata agent workflow — generates an installation token, checks out the repository, bootstraps the environment, and executes the agent via fit-eval.

inputs:
  # --- Authentication ---
  app-id:
    description: GitHub App ID for token generation and git identity
    required: true
  app-private-key:
    description: GitHub App private key for token generation
    required: true
  anthropic-api-key:
    description: Anthropic API key for the Claude Agent SDK
    required: true
  app-slug:
    description: GitHub App slug for git identity
    required: false
    default: "kata-agent-team"
  # --- Agent configuration ---
  mode:
    description: Execution mode (run, supervise, facilitate)
    required: false
    default: "run"
  task-text:
    description: Inline task text (mutually exclusive with task-file)
    required: false
  task-file:
    description: Path to task file (mutually exclusive with task-text)
    required: false
  agent-profile:
    description: Agent profile name (run and supervise modes)
    required: false
  facilitator-profile:
    description: Facilitator profile name (facilitate mode)
    required: false
  agent-profiles:
    description: Comma-separated agent profile names (facilitate mode)
    required: false
  supervisor-profile:
    description: Supervisor agent profile name (supervise mode)
    required: false
  agent-model:
    description: Claude model for agents (all modes)
    required: false
    default: "claude-opus-4-7[1m]"
  supervisor-model:
    description: Claude model for the supervisor (supervise mode)
    required: false
    default: "claude-opus-4-7[1m]"
  facilitator-model:
    description: Claude model for the facilitator (facilitate mode)
    required: false
    default: "claude-opus-4-7[1m]"
  max-turns:
    description: Maximum turns (0 = unlimited)
    required: false
    default: "200"
  allowed-tools:
    description: Comma-separated list of allowed tools for the agent
    required: false
    default: "Bash,Read,Glob,Grep,Write,Edit,Agent,TodoWrite"
  supervisor-allowed-tools:
    description: Comma-separated list of allowed tools for the supervisor (supervise mode only)
    required: false
  task-amend:
    description: Additional text appended to the task prompt for steering
    required: false
  # --- Optional overrides ---
  cwd:
    description: Agent working directory (run mode)
    required: false
    default: "."
  supervisor-cwd:
    description: Supervisor working directory (supervise mode)
    required: false
    default: "."
  agent-cwd:
    description: Agent working directory (supervise and facilitate modes)
    required: false
    default: "."
  timeout-minutes:
    description: Maximum minutes before cancellation
    required: false
    default: "45"
  trace:
    description: Enable trace capture and artifact upload
    required: false
    default: "true"
  case:
    description: Case identifier embedded in trace artifact filenames (use the matrix dimension for matrix runs)
    required: false
    default: "default"
  wiki:
    description: Enable wiki checkout and sync
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Generate installation token
      id: ci-app
      uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        fetch-depth: 0
        token: ${{ steps.ci-app.outputs.token }}

    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: "1.3.11"
        no-cache: false

    - name: Configure git identity
      shell: bash
      env:
        APP_SLUG: ${{ inputs.app-slug }}
        APP_ID: ${{ inputs.app-id }}
      run: |
        if [ -n "$APP_SLUG" ] && [ -n "$APP_ID" ]; then
          git config --global user.name "${APP_SLUG}[bot]"
          git config --global user.email "${APP_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
        else
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        fi

    - name: Checkout wiki
      if: inputs.wiki == 'true'
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        repository: ${{ github.repository }}.wiki
        path: wiki
        token: ${{ steps.ci-app.outputs.token }}

    - name: Bootstrap
      shell: bash
      run: ./scripts/bootstrap.sh

    - name: Push wiki changes
      if: inputs.wiki == 'true'
      uses: ./post-run
      with:
        command: just wiki-push

    - name: Assess and Act
      uses: forwardimpact/fit-eval@v1
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GH_TOKEN: ${{ steps.ci-app.outputs.token }}
        CLAUDE_CODE_USE_BEDROCK: "0"
      with:
        mode: ${{ inputs.mode }}
        task-text: ${{ inputs.task-text }}
        task-file: ${{ inputs.task-file }}
        agent-profile: ${{ inputs.agent-profile }}
        facilitator-profile: ${{ inputs.facilitator-profile }}
        agent-profiles: ${{ inputs.agent-profiles }}
        supervisor-profile: ${{ inputs.supervisor-profile }}
        agent-model: ${{ inputs.agent-model }}
        supervisor-model: ${{ inputs.supervisor-model }}
        facilitator-model: ${{ inputs.facilitator-model }}
        max-turns: ${{ inputs.max-turns }}
        allowed-tools: ${{ inputs.allowed-tools }}
        supervisor-allowed-tools: ${{ inputs.supervisor-allowed-tools }}
        task-amend: ${{ inputs.task-amend }}
        cwd: ${{ inputs.cwd }}
        supervisor-cwd: ${{ inputs.supervisor-cwd }}
        agent-cwd: ${{ inputs.agent-cwd }}
        timeout-minutes: ${{ inputs.timeout-minutes }}
        trace: ${{ inputs.trace }}
        case: ${{ inputs.case }}
